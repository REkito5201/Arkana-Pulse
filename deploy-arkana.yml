- name: Развертывание ARKANA PULSE
  hosts: localhost
  connection: local
  vars:
    project_dir: "{{ lookup('env', 'HOME') }}/Arkana-Pulse"
  tasks:
    - name: Создаем .env файл из шаблона
      ansible.builtin.copy:
        src: "{{ project_dir }}/.env.example"
        dest: "{{ project_dir }}/.env"
        remote_src: yes
        force: no

    - name: Поднимаем стек через Docker Compose
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
